<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,user-scalable=no">
  <title>Eli Home</title>
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">ELI HOME</div><h1 id="greeting">Good evening, Eli.</h1></div>
      <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
    </header>
    <section class="hero">
      <div class="hero-copy">
        <span class="pill">YOUR TV · SIMPLIFIED</span>
        <h2>What do you want<br>to watch?</h2>
        <p>Your favourites, ready when you are.</p>
      </div>
      <div class="orb" aria-hidden="true"></div>
    </section>
    <section>
      <div class="section-head"><h3>Apps</h3><span>Use arrows · OK to open</span></div>
      <div id="apps" class="apps">
        <button class="app prime" aria-label="Open Prime Video" data-app="evKhCgZelL.AmazonIgnitionLauncher2"><span class="logo">prime video</span><small>Prime Video</small></button>
        <button class="app plex" aria-label="Open Plex" data-app="kIciSQlYEM.plex"><span class="logo">PLEX</span><small>Plex</small></button>
        <button class="app netflix" aria-label="Open Netflix" data-app="org.tizen.netflix-app"><span class="logo">NETFLIX</span><small>Netflix</small></button>
        <button class="app spotify" aria-label="Open Spotify" data-app="rJeHak5zRg.Spotify"><span class="logo"><b>●</b> Spotify</span><small>Spotify</small></button>
        <button class="app sirius disabled" aria-label="SiriusXM, not installed" aria-disabled="true" data-unavailable="SiriusXM is not installed on this TV"><span class="logo">SiriusXM</span><small>Not installed</small></button>
      </div>
    </section>
    <footer><span id="status" aria-live="polite">Ready</span><span><b class="key red"></b> Details &nbsp; <b class="key green"></b> Refresh</span></footer>
  </main>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="js/home.js"></script>
</body>
</html>
